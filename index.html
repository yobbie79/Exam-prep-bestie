<script>
const TOPICS=[
{n:"Describe Cloud Concepts",e:"☁️",w:"25–30% of the exam",d:"Cloud models, shared responsibility, consumption pricing, benefits, and IaaS/PaaS/SaaS.",o:["Compare public, private and hybrid clouds","Understand CapEx vs OpEx and consumption pricing","Explain elasticity, scalability, and availability","Differentiate IaaS, PaaS, and SaaS"]},
{n:"Describe Azure Architecture and Services",e:"🏗️",w:"35–40% of the exam",d:"Regions, zones, resource organization, compute, networking, storage, databases, and identity.",o:["Explain regions, availability zones, and resource groups","Choose compute, container, and serverless services","Describe networking, storage, and database options","Understand identity with Microsoft Entra ID"]},
{n:"Describe Azure Management and Governance",e:"🛡️",w:"30–35% of the exam",d:"Cost tools, governance, compliance, deployment tools, and monitoring.",o:["Plan and control costs","Apply governance with Policy, locks, and tags","Manage resources with Arc and IaC","Monitor with Azure Monitor and Advisor"]}];
const Q=[
{t:0,q:"A company stops buying its own servers and instead pays monthly for cloud services. Which change best describes this?",o:["Operational expenditure replaces capital expenditure","Capital expenditure replaces operational expenditure","Fixed costs replace variable costs","Taxes replace depreciation"],a:0,w:["Cloud costs are ongoing and usage-based (OpEx), so large upfront hardware purchases (CapEx) shrink.","This is reversed: CapEx is the upfront hardware spend that cloud avoids.","Pay-as-you-go makes costs more variable, not more fixed.","Tax accounting is not what defines the shift to cloud."],l:["CapEx is upfront spending on assets; OpEx is ongoing spending on services.","Buying a car outright (CapEx) vs. renting one by the day (OpEx).","Reservations lower the cost of steady workloads but commit you for 1 or 3 years."]},
{t:0,q:"In a SaaS solution, which responsibility always stays with the customer?",o:["Their data, accounts, and identities","Physical network cabling","Hypervisor patching","Building the service’s application code"],a:0,w:["Whatever the model, customers always own their information, accounts, and identities.","The cloud provider manages physical infrastructure in every cloud model.","Hypervisors are part of the provider’s infrastructure.","In SaaS the provider builds and runs the application."],l:["Shared responsibility: the provider secures the cloud; you secure what you put in it.","Renting an apartment: the landlord fixes the building, you lock your own door.","On-premises = you manage everything; IaaS = you manage OS and up; SaaS = you manage data and access."]},
{t:0,q:"Which Azure service is an example of Infrastructure as a Service (IaaS)?",o:["Azure Virtual Machines","Microsoft 365","Azure App Service","Azure Functions"],a:0,w:["You manage the guest OS and software on a VM while Azure runs the hardware.","Microsoft 365 is ready-to-use software, so it is SaaS.","App Service hosts web apps without OS management, so it is PaaS.","Functions is serverless, even further from managing infrastructure."],l:["IaaS gives you virtualized compute, storage, and networking to configure yourself.","Leasing an empty office and furnishing it yourself.","IaaS = most control and most work; PaaS = focus on code; SaaS = just use it."]},
{t:0,q:"An online shop automatically adds resources during a sale and removes them afterward. Which cloud benefit is this?",o:["Elasticity","Data sovereignty","Total cost of ownership","Geo-distribution"],a:0,w:["Elasticity means resources automatically grow and shrink with demand.","Data sovereignty is about where data legally resides.","TCO is a cost-comparison measure, not an automatic resizing feature.","Geo-distribution places services near users in multiple locations."],l:["Elasticity matches capacity to demand in near real time.","An accordion expanding and contracting as needed.","Scalability is the ability to grow; elasticity adds the automatic shrink-and-grow behavior."]},
{t:0,q:"Which pricing model charges you only for the resources you actually use?",o:["Consumption-based","Perpetual licence","Capital purchase","Fixed annual contract with no changes"],a:0,w:["Consumption-based pricing bills for usage, such as per second or per GB.","A perpetual licence is paid once regardless of use.","A capital purchase is an upfront asset buy.","A fixed contract does not adjust to actual use."],l:["Pay for what you consume, with no upfront cost.","Like an electricity bill based on kilowatt-hours used.","Reserved instances and savings plans trade flexibility for discounts."]},
{t:0,q:"Compared with 99.9%, an SLA of 99.99% means:",o:["Less permitted downtime","More permitted downtime","A guaranteed lower price","No planned maintenance"],a:0,w:["More nines means a smaller allowed downtime window per year.","The reverse: 99.9% allows more downtime.","SLA percentages describe availability, not price.","SLAs do not promise zero maintenance."],l:["An SLA is a commitment on availability or performance, often with service credits.","99.9% allows about 8.8 hours downtime a year; 99.99% about 53 minutes.","Composite SLAs combine several services and are usually lower than any single one."]},
{t:0,q:"A bank keeps sensitive records in its own datacenter and runs analytics on Azure, with both connected. Which model is this?",o:["Hybrid cloud","Public cloud","Private cloud","Community cloud"],a:0,w:["Hybrid combines on-premises or private resources with public cloud.","Public cloud alone would have no on-premises component.","A private cloud alone would not include Azure public services.","Community cloud is not a standard AZ-900 model for this scenario."],l:["Hybrid lets workloads sit where they fit best.","Keeping valuables at home but using a rented warehouse for bulk items.","Public = shared provider hardware; private = one organization; hybrid = both."]},
{t:0,q:"Adding more VM instances to handle extra load is called:",o:["Scaling out (horizontal scaling)","Scaling up (vertical scaling)","Failover","Migration"],a:0,w:["Scaling out adds more instances in parallel.","Scaling up makes one instance larger (more CPU or RAM).","Failover switches to a standby after a failure.","Migration moves workloads between environments."],l:["Horizontal scaling adds instances; vertical scaling resizes one.","Opening more checkout lanes vs. hiring a faster cashier.","Azure Virtual Machine Scale Sets automate scaling out."]},
{t:0,q:"A team wants to deploy its own web app without managing servers or operating systems. Which model fits best?",o:["PaaS","IaaS","SaaS","Colocation"],a:0,w:["PaaS runs your code on a managed platform.","IaaS would require you to manage the OS.","SaaS is finished software; they are deploying their own app.","Colocation rents space for your own hardware."],l:["PaaS provides a managed platform for building and hosting apps.","Cooking in a shared kitchen that supplies the oven and tools.","App Service (PaaS) vs. Virtual Machines (IaaS): less control but less maintenance."]},
{t:0,q:"Which statement describes a private cloud?",o:["Resources used exclusively by one organization","Resources open to anyone on the internet","Only Microsoft 365 services","A cloud with no virtualization"],a:0,w:["A private cloud is dedicated to a single organization.","That describes a public cloud.","Microsoft 365 is SaaS, unrelated to the definition.","Private clouds typically still use virtualization."],l:["A cloud environment for one organization, hosted on-site or by a provider.","A private members-only gym.","Private gives more control; public gives more scale and lower upfront cost."]},
{t:1,q:"What is an Azure availability zone?",o:["Physically separate datacenters within one region","A group of Azure subscriptions","A pair of Azure regions","A virtual network subnet"],a:0,w:["Zones have independent power, cooling, and networking inside a region.","Subscriptions are billing and access boundaries.","Paired regions are separate regions, not zones.","Subnets are network address ranges."],l:["Zones protect against datacenter-level failures.","Three separate buildings in the same city.","Zones protect within a region; region pairs protect against regional disasters."]},
{t:1,q:"What is an Azure resource group?",o:["A logical container for related resources","A physical server rack","A firewall rule set","A billing invoice"],a:0,w:["Resource groups organize resources that share a lifecycle.","Racks are physical and invisible to you.","Firewall rules are separate network security settings.","Billing is handled at subscription level."],l:["Each resource belongs to exactly one resource group.","A project folder holding related files.","Resource group = organization; subscription = billing and access; management group = many subscriptions."]},
{t:1,q:"Which service is best for storing large amounts of unstructured data such as images and videos?",o:["Azure Blob Storage","Azure SQL Database","Azure Virtual Network","Azure Key Vault"],a:0,w:["Blob storage is built for massive unstructured objects.","SQL Database stores relational, structured data.","A virtual network is for connectivity, not storage.","Key Vault stores secrets and keys, not media."],l:["Blob = binary large objects stored in containers.","A huge digital closet for photos and videos.","Files offers SMB shares; Blob offers object storage; Disks attach to VMs."]},
{t:1,q:"Which service provides a private connection from on-premises to Azure that does not cross the public internet?",o:["Azure ExpressRoute","Azure VPN Gateway","Azure DNS","Azure Load Balancer"],a:0,w:["ExpressRoute uses a dedicated connection through a connectivity provider.","VPN Gateway encrypts traffic but sends it over the public internet.","DNS resolves names; it does not connect networks.","Load Balancer distributes traffic; it does not link networks."],l:["A private line between your network and Azure with predictable performance.","A private highway vs. an encrypted car on the public road.","ExpressRoute: private and costlier; VPN Gateway: encrypted over internet and cheaper."]},
{t:1,q:"Which service runs small pieces of code triggered by events, with no server management?",o:["Azure Functions","Azure Virtual Machines","Azure Virtual Desktop","Azure Bastion"],a:0,w:["Functions is serverless, event-driven compute billed on execution.","VMs require you to manage the OS.","Virtual Desktop delivers desktops and apps.","Bastion provides secure RDP/SSH access to VMs."],l:["Serverless means servers still exist, but Azure manages them.","A light switch that runs code when flipped.","Functions = short event-driven code; App Service = always-on web apps."]},
{t:1,q:"Which is a globally distributed NoSQL database service?",o:["Azure Cosmos DB","Azure SQL Managed Instance","Azure Files","Azure Backup"],a:0,w:["Cosmos DB replicates data across regions with low latency.","SQL Managed Instance is a relational database.","Azure Files is a file share service.","Azure Backup protects data, not a database engine."],l:["Multi-model NoSQL with turnkey global distribution.","A notebook automatically copied to offices worldwide.","Cosmos DB = NoSQL at global scale; Azure SQL = relational."]},
{t:1,q:"Which service provides cloud identity management and single sign-on?",o:["Microsoft Entra ID","Azure Firewall","Azure Monitor","Azure DevOps"],a:0,w:["Entra ID manages identities, authentication, and SSO.","Azure Firewall filters network traffic.","Monitor collects telemetry.","DevOps supports software delivery."],l:["Entra ID (formerly Azure Active Directory) verifies who users are.","A digital ID badge accepted by many buildings.","Authentication proves who you are; authorization decides what you can do."]},
{t:1,q:"Which Azure service orchestrates and manages containers at scale?",o:["Azure Kubernetes Service (AKS)","Azure Blob Storage","Azure Site Recovery","Azure Event Grid"],a:0,w:["AKS runs managed Kubernetes clusters.","Blob Storage stores objects.","Site Recovery handles disaster recovery.","Event Grid routes events between services."],l:["Orchestration handles deploying, scaling, and healing containers.","A conductor coordinating an orchestra.","Container Instances runs single containers quickly; AKS manages fleets."]},
{t:1,q:"Which feature lets a group of identical VMs scale automatically with demand?",o:["Virtual Machine Scale Sets","Availability sets","Azure Dedicated Host","Azure Files"],a:0,w:["Scale sets add or remove identical VMs based on rules.","Availability sets spread VMs to reduce failure impact, not autoscale.","Dedicated Host provides physical servers for one customer.","Azure Files provides file shares."],l:["Manages a group of load-balanced, identical VMs.","Adding checkout lanes during rush hour.","Scale sets = capacity; availability sets and zones = resilience."]},
{t:1,q:"Which storage redundancy option copies data to a secondary region?",o:["Geo-redundant storage (GRS)","Locally redundant storage (LRS)","Zone-redundant storage (ZRS)","No option; storage never replicates"],a:0,w:["GRS replicates asynchronously to a paired region.","LRS keeps copies in one datacenter.","ZRS copies across zones in the same region.","Azure Storage offers several redundancy options."],l:["Redundancy keeps data safe against failures.","Keeping a backup copy in another city.","LRS < ZRS < GRS in protection scope and cost."]},
{t:2,q:"Which tool analyzes your actual Azure spending and lets you set budgets?",o:["Microsoft Cost Management","Pricing calculator","Total Cost of Ownership calculator","Azure Service Health"],a:0,w:["Cost Management tracks, analyzes, and alerts on real spend.","The pricing calculator estimates future costs before deploying.","The TCO calculator compares on-premises with Azure.","Service Health reports incidents, not costs."],l:["Monitor and optimize cloud costs with budgets and alerts.","A bank statement with spending alerts.","Calculators estimate beforehand; Cost Management tracks afterward."]},
{t:2,q:"Which tool compares the estimated cost of running workloads on-premises versus in Azure?",o:["Total Cost of Ownership (TCO) calculator","Pricing calculator","Azure Advisor","Azure Policy"],a:0,w:["The TCO calculator models savings from moving to Azure.","The pricing calculator estimates Azure-only configurations.","Advisor gives optimization recommendations.","Policy enforces rules."],l:["TCO includes hardware, power, space, and labor costs.","Comparing owning a car with total ride-share costs.","TCO = compare with on-premises; Pricing calculator = price Azure services."]},
{t:2,q:"How can you group resources across several resource groups for departmental cost reporting?",o:["Apply tags","Move them to one region","Add resource locks","Create availability zones"],a:0,w:["Tags are name-value labels usable in cost reports.","Region does not label ownership.","Locks prevent changes, not group costs.","Zones are about resilience."],l:["Tags such as Department=Finance add metadata.","Sticky notes on boxes.","Tags classify; resource groups contain; policy can require tags."]},
{t:2,q:"Which service can prevent creation of resources outside approved regions?",o:["Azure Policy","Azure role-based access control (RBAC)","Resource locks","Azure Monitor"],a:0,w:["Policy evaluates and enforces rules on resource properties.","RBAC controls who can act, not which regions are allowed.","Locks block delete or modify on existing resources.","Monitor observes, it does not enforce."],l:["Policy enforces organizational standards and assesses compliance.","Building codes that must be met.","RBAC = who can do what; Policy = what is allowed to exist."]},
{t:2,q:"Which feature stops accidental deletion even for users with Owner permissions?",o:["Resource lock (Delete)","Tag","Azure Advisor","Management group"],a:0,w:["A Delete lock blocks deletion until it is removed.","Tags only label.","Advisor only recommends.","Management groups organize subscriptions."],l:["Locks come as Delete or Read-only.","A safety cover on a switch.","Locks protect resources; RBAC grants permissions."]},
{t:2,q:"Which service gives personalized recommendations for reliability, security, cost, performance, and operational excellence?",o:["Azure Advisor","Azure Monitor","Azure Policy","Azure Arc"],a:0,w:["Advisor analyzes your resources and recommends improvements.","Monitor collects metrics and logs.","Policy enforces rules.","Arc extends management to other environments."],l:["A free best-practice consultant for your deployment.","A health check-up with advice.","Advisor suggests; Policy enforces."]},
{t:2,q:"Which service collects and analyzes metrics and logs from Azure and on-premises resources?",o:["Azure Monitor","Azure Cost Management","ARM templates","Microsoft Purview"],a:0,w:["Monitor gathers telemetry and drives alerts and dashboards.","Cost Management tracks spend.","ARM templates deploy resources.","Purview governs data."],l:["Full-stack monitoring with alerts and insights.","A dashboard in a car showing all vitals.","Monitor = ongoing telemetry; Service Health = Azure incidents affecting you."]},
{t:2,q:"Deploying identical environments repeatedly using declarative files is called:",o:["Infrastructure as code (ARM templates or Bicep)","Manual portal deployment","Resource locking","Tagging"],a:0,w:["IaC defines infrastructure in files for consistent deployments.","Manual clicking is error-prone and hard to repeat.","Locking protects resources.","Tagging labels resources."],l:["Declare what you want and Azure builds it.","A recipe versus improvising each time.","Portal = interactive; CLI/PowerShell = imperative scripts; ARM/Bicep = declarative."]},
{t:2,q:"Which service extends Azure management to servers running outside Azure?",o:["Azure Arc","Azure Cloud Shell","Azure Advisor","Azure Bastion"],a:0,w:["Arc projects on-premises and multicloud resources into Azure.","Cloud Shell is a browser terminal.","Advisor gives recommendations.","Bastion provides secure VM access."],l:["One control plane for resources anywhere.","A universal remote for all devices.","Arc supports hybrid management; Cloud Shell is just a command-line tool."]},
{t:2,q:"Which service helps govern and discover data across on-premises, multicloud, and SaaS sources?",o:["Microsoft Purview","Azure Service Health","Azure Resource Graph","Azure DNS"],a:0,w:["Purview provides data governance, cataloging, and compliance.","Service Health reports Azure incidents.","Resource Graph queries Azure resource metadata.","DNS resolves domain names."],l:["A unified data governance and compliance solution.","A library catalog for all your data.","Purview governs data; Policy governs resource configuration."]}
];
const NOTES=[[{h:"Cloud models",b:["<b>Public:</b> provider-owned hardware shared by many customers over the internet.","<b>Private:</b> resources used by one organization only.","<b>Hybrid:</b> public plus private/on-premises, connected so workloads sit where they fit best."]},{h:"Service types",b:["<b>IaaS:</b> you manage the OS and up (Azure Virtual Machines).","<b>PaaS:</b> you manage your app and data (Azure App Service).","<b>SaaS:</b> finished software you simply use (Microsoft 365).","More control means more responsibility."]},{h:"Shared responsibility",b:["The provider always secures the physical datacenter.","The customer always owns their data, accounts, identities and devices.","Everything in between shifts with IaaS, PaaS and SaaS."]},{h:"Costs and benefits",b:["<b>CapEx</b> is upfront spend; <b>OpEx</b> is ongoing, pay-as-you-go spend.","Consumption-based pricing: pay only for what you use.","Scalability (scale up or out) and elasticity (automatic grow and shrink).","High availability is promised by an SLA: more nines mean less downtime."]}],[{h:"Global infrastructure",b:["<b>Region:</b> a set of datacenters in one geographic area.","<b>Availability zone:</b> physically separate datacenters inside a region.","<b>Region pair:</b> two regions that back each other up for disaster recovery."]},{h:"Organizing resources",b:["Hierarchy: management groups, then subscriptions, then resource groups, then resources.","A resource group is a logical container; each resource lives in exactly one.","Subscriptions are boundaries for billing and access."]},{h:"Compute and networking",b:["Virtual Machines (IaaS), Scale Sets (autoscale), App Service (PaaS web apps), Functions (serverless).","Containers: Container Instances for single containers, AKS for orchestration.","Virtual Network connects resources; VPN Gateway is encrypted over the internet; ExpressRoute is a private connection."]},{h:"Storage, databases and identity",b:["Storage: Blob (objects), Files (shares), Disks; redundancy LRS, ZRS, GRS.","Databases: Azure SQL (relational), Cosmos DB (global NoSQL).","Microsoft Entra ID handles sign-in, single sign-on and MFA; RBAC controls access."]}],[{h:"Cost management",b:["<b>Pricing calculator</b> estimates Azure costs before you deploy.","<b>TCO calculator</b> compares on-premises with Azure.","<b>Cost Management</b> tracks actual spend and sets budgets.","Costs depend on region, resource type and usage; tags help report by team."]},{h:"Governance and compliance",b:["<b>RBAC:</b> who can do what. <b>Policy:</b> what is allowed to exist.","<b>Resource locks</b> stop accidental deletion or changes.","<b>Tags</b> label resources; <b>Purview</b> governs data across sources."]},{h:"Managing and deploying",b:["Tools: Azure portal, Cloud Shell, CLI and PowerShell.","Infrastructure as code (ARM templates, Bicep) gives repeatable deployments.","<b>Azure Arc</b> extends management to servers outside Azure."]},{h:"Monitoring",b:["<b>Azure Advisor:</b> personalized best-practice recommendations.","<b>Service Health:</b> Azure incidents that affect you.","<b>Azure Monitor:</b> metrics, logs and alerts across resources."]}]];

const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function nav(){const l=V==="quiz"||V==="review"||V==="notes"?"← Back to topic":"← Back to topics";return `<div class="top"><button class="btn s sm" data-a="back">${l}</button><span class="logo" data-a="go" data-v="welcome">🎓 EXAM PREP BESTIE</span></div>`}
const disc=`<p class="disc">EXAM PREP BESTIE is an independent, unofficial study tool. It is not affiliated with or endorsed by Microsoft. Questions are original and based on the public AZ-900 Microsoft Learn outline.</p>`;
function welcome(){return `<svg class="bgart" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><symbol id="pc" viewBox="0 0 80 70"><rect x="4" y="4" width="72" height="44" rx="5"/><path d="M40 48v12M22 62h36M14 14h30M14 24h20"/></symbol><path d="M300 230c-55 0-60-50-20-60 0-45 55-65 95-35 40-20 90 5 85 45 40 5 45 50 5 50z"/><path d="M60 110c-30 0-30-30-5-33 5-25 40-25 48-5 25-3 30 38 0 38z" opacity=".6"/><path d="M640 90c-30 0-30-28-5-32 5-22 38-22 46-4 24-2 28 36 0 36z" opacity=".6"/><g stroke-dasharray="6 7"><path d="M360 235L120 340M390 240L280 390M410 240L440 350M440 235L600 385M470 225L730 325"/></g><use href="#pc" x="80" y="340" width="80" height="70"/><use href="#pc" x="240" y="390" width="80" height="70"/><use href="#pc" x="400" y="350" width="80" height="70"/><use href="#pc" x="560" y="385" width="80" height="70"/><use href="#pc" x="690" y="325" width="80" height="70"/></svg><h2 style="text-align:center;font-size:clamp(1.5rem,5vw,2.2rem);margin:8px 0 0">Welcome, Bestie! 👋</h2><div class="hero" style="padding-top:28px"><div style="font-size:4rem">🎓</div><h1>EXAM PREP BESTIE</h1><p class="t">Learn cloud concepts. Understand Azure. Pass because you deserve.</p><p class="mut">Unofficial AZ-900 Azure Fundamentals practice: 30 original questions, clear explanations, and mistake review.</p><button class="btn" data-a="go" data-v="dash" style="font-size:1.15rem;padding:15px 34px">Get Started →</button></div>${disc}`}
function dash(){return `<div class="top"><button class="btn s sm" data-a="go" data-v="welcome">← Back</button><span class="logo">🎓 EXAM PREP BESTIE</span></div><h2>Choose a topic</h2><p class="mut">${all()}/30 questions answered · ${S.xp} XP</p><div class="g2">${TOPICS.map((t,i)=>`<button class="btn" data-a="go" data-v="topic" data-p="${i}" style="text-align:left;font-size:1.15rem;padding:22px 24px;border-radius:20px">${t.e} ${t.n}<br><small style="font-weight:600">${done(i)}/10 answered</small></button>`).join("")}</div><div class="card" style="margin-top:20px"><h3>✨ How the quiz works</h3><ul class="how"><li>🎯 Pick a topic, then start its 10-question quiz.</li><li>👆 Answer one question at a time.</li><li>⚡ Get instant feedback on why every option is right or wrong.</li><li>💡 Open Learn More for a definition, example and comparison.</li><li>⬅️ Use Previous question to revisit earlier answers.</li><li>📝 Write Points to clarify as you study.</li><li>🔁 Missed questions go to Review mistakes so you can retry them.</li><li>⭐ Earn 10 XP per correct answer, plus 20 for scoring 80%+.</li></ul><button class="btn s sm" data-a="refresh">↻ Refresh questions done</button></div>${disc}`}
function _oldDash(){const p=Math.round(100*all()/Q.length);
return `${nav()}<h2>Hey, bestie! 👋</h2><div class="grid"><div class="card"><div class="mut">Overall progress</div><div class="big">${p}%</div>${bar(p)}<div class="mut">${all()} of ${Q.length} questions answered</div></div><div class="card"><div class="mut">XP</div><div class="big">${S.xp}</div><span class="pill">Level ${Math.floor(S.xp/100)+1}</span><div class="mut" style="margin-top:6px">${S.att} quiz attempts</div></div></div>
<div class="card"><h3>Quick actions</h3><div class="row"><button class="btn" data-a="start" data-t="mix">🎲 Mixed quiz (10)</button><button class="btn s" data-a="go" data-v="review">🔁 Review mistakes (${S.mis.length})</button><button class="btn s" data-a="go" data-v="results" ${S.hist.length?"":"disabled"}>📊 Last results</button><button class="btn s" data-a="reset">Reset progress</button></div></div>
<h3>Study areas</h3><div class="grid">${TOPICS.map((t,i)=>`<div class="card"><div style="font-size:2rem">${t.e}</div><h3>${t.n}</h3><span class="pill">${t.w}</span><p class="mut">${t.d}</p>${bar(done(i)*10)}<div class="mut" style="margin:6px 0 12px">${done(i)}/10 answered · accuracy ${acc(i)===null?"–":acc(i)+"%"}</div><div class="row"><button class="btn sm" data-a="start" data-t="${i}">Start quiz</button><button class="btn s sm" data-a="go" data-v="topic" data-p="${i}">Topic info</button></div></div>`).join("")}</div>${disc}`}
function topic(){const t=TOPICS[P];return `${nav()}<div class="card"><div style="font-size:2.4rem">${t.e}</div><h2>${t.n}</h2><span class="pill">${t.w}</span><p>${t.d}</p><h3>You should be able to:</h3><ul>${t.o.map(x=>`<li>${x}</li>`).join("")}</ul><p class="mut">Progress: ${done(P)}/10 answered · accuracy ${acc(P)===null?"–":acc(P)+"%"}</p><div class="row"><button class="btn" data-a="go" data-v="notes" data-p="${P}">📖 Read Notes</button><button class="btn" data-a="start" data-t="${P}">Start 10-question quiz</button><button class="btn s" data-a="go" data-v="review" data-p="${P}">Review mistakes (${S.mis.filter(i=>Q[i].t===P).length})</button></div></div>`}
function quiz(){const id=G.ids[G.i],q=Q[id],a=G.sel!==null,L=["A","B","C","D"];
let h=`${nav()}<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${TOPICS[q.t].n}</span><span class="mut">Question ${G.i+1} of ${G.ids.length}</span></div>${bar(100*G.i/G.ids.length)}<h3 style="margin-top:16px">${q.q}</h3>`;
h+=q.o.map((o,j)=>`<button class="opt ${a?(j===q.a?"ok":j===G.sel?"no":""):""}" data-a="pick" data-j="${j}" ${a?"disabled":""}><b>${L[j]}.</b> ${o} ${a&&j===q.a?"✓":a&&j===G.sel?"✗":""}</button>`).join("");
if(a){const c=G.sel===q.a;h+=`<h3 style="color:var(--${c?"ok":"no"})">${c?"Correct! +10 XP 🎉":"Not quite — let’s learn why."}</h3>`+q.o.map((o,j)=>`<div class="ex ${j===q.a?"ok":"no"}"><b>${L[j]} ${j===q.a?"is correct":"is unsuitable"}:</b> ${q.w[j]}</div>`).join("")+`<details open><summary>💡 Learn More</summary><div class="ex"><b>Simple definition:</b> ${q.l[0]}</div><div class="ex"><b>Real-life example:</b> ${q.l[1]}</div><div class="ex"><b>Compare:</b> ${q.l[2]}</div></details><button class="btn" data-a="next">${G.i+1<G.ids.length?"Next question →":"See results"}</button>`}
return h+`<div class="row" style="margin-top:14px">${G.i>0?'<button class="btn s sm" data-a="prev">‹ Previous question</button>':''}</div></div><div class="card"><h3>📝 POINTS TO CLARIFY</h3><textarea id="note" data-id="${id}" maxlength="500" placeholder="Write short notes on anything you want to clarify…">${(S.notes[id]||"").replace(/</g,"&lt;")}</textarea><p class="mut" style="margin:6px 0 0">Saved automatically on this device.</p></div><div style="height:100px"></div><div class="askw"><button class="ask btn">🤖 Ask AI</button><small>Not yet integrated to AI</small></div>`}
function results(){const r=S.hist[S.hist.length-1];if(!r)return dash();const p=Math.round(100*r.s/r.n);
const st=[],wk=[];TOPICS.forEach((t,i)=>{const a=acc(i);if(a===null)wk.push(`${t.n}: not attempted yet`);else if(a>=80)st.push(`${t.n} (${a}%)`);else wk.push(`${t.n} (${a}%)`)});
let nx=TOPICS.map((t,i)=>[i,acc(i)===null?-1:acc(i)]).sort((a,b)=>a[1]-b[1])[0][0];
return `${nav()}<div class="card" style="text-align:center"><div class="mut">${r.name}</div><div class="big">${r.s}/${r.n}</div><h2>${p}% ${p>=80?"🌟 Excellent work!":p>=60?"👍 Good progress!":"💪 Keep going, you’ve got this!"}</h2><p class="mut">+${r.xp} XP earned</p></div>
<div class="card"><h3>Topic performance (all attempts)</h3>${TOPICS.map((t,i)=>`<p style="margin:10px 0 4px">${t.e} ${t.n} <b>${acc(i)===null?"–":acc(i)+"%"}</b></p>${bar(acc(i)||0)}`).join("")}</div>
<div class="grid"><div class="card"><h3>💪 Strengths</h3><p>${st.length?st.join("<br>"):"Reach 80% in a topic to unlock a strength."}</p></div><div class="card"><h3>🎯 Needs improvement</h3><p>${wk.length?wk.join("<br>"):"Nothing below 80%. Great job!"}</p></div></div>
<div class="card"><h3>Study next</h3><p>${S.mis.length?`Review your ${S.mis.length} missed question${S.mis.length>1?"s":""} first, then `:""}practise <b>${TOPICS[nx].n}</b>${acc(nx)===null?", which you haven’t tried yet.":`, your lowest score at ${acc(nx)}%.`}</p><div class="row"><button class="btn" data-a="start" data-t="${nx}">Quiz: ${TOPICS[nx].n}</button><button class="btn s" data-a="go" data-v="review" data-p="${nx}">Review mistakes</button><button class="btn s" data-a="go" data-v="dash">Topics</button></div></div>`}
function review(){const L=["A","B","C","D"];const M=S.mis.filter(i=>Q[i].t===P);
if(!M.length)return `${nav()}<div class="card" style="text-align:center"><div style="font-size:3rem">🎉</div><h2>No mistakes to review</h2><p class="mut">Answer some quiz questions and any misses will appear here.</p><button class="btn" data-a="go" data-v="dash">Back to topics</button></div>`;
return `${nav()}<h2>Review mistakes: ${TOPICS[P].n}</h2><div class="row" style="margin-bottom:14px"><button class="btn" data-a="retryall">Retry all (${M.length})</button></div>`+M.map(id=>{const q=Q[id];return `<div class="card"><span class="pill">${TOPICS[q.t].n}</span><h3 style="margin-top:10px">${q.q}</h3><p><b>Correct answer:</b> ${L[q.a]}. ${q.o[q.a]}</p><details><summary>Read the explanation</summary>${q.o.map((o,j)=>`<div class="ex ${j===q.a?"ok":"no"}"><b>${L[j]}. ${o}</b><br>${q.w[j]}</div>`).join("")}<div class="ex"><b>Simple definition:</b> ${q.l[0]}</div><div class="ex"><b>Real-life example:</b> ${q.l[1]}</div><div class="ex"><b>Compare:</b> ${q.l[2]}</div></details><button class="btn sm" data-a="retry" data-id="${id}">Retry this question</button></div>`}).join("")}
function render(){document.body.className=V==="welcome"?"g":V==="dash"?"":V==="quiz"?"q":"t";app.innerHTML=({welcome,dash,topic,notes,quiz,results,review})[V]();window.scrollTo(0,0)}
function go(v,p){V=v;if(p!==undefined)P=+p;render()}
function begin(list,name,mode){G={ids:list,i:0,sel:null,picks:[],s:0,xp:0,name,mode};V="quiz";render()}
document.addEventListener("input",e=>{if(e.target.id==="note"){S.notes[e.target.dataset.id]=e.target.value;save()}});document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const d=b.dataset;
switch(d.a){
case"go":go(d.v,d.p);break;
case"start":P=+d.t;begin(shuffle(ids(P)),TOPICS[P].n,"quiz");break;case"refresh":if(confirm("Refresh all answered questions? Answers, scores and mistakes will be cleared (XP and notes are kept).")){S.ans={};S.tot=[[0,0],[0,0],[0,0]];S.mis=[];S.hist=[];S.att=0;save();render()}break;case"addnote":{const ti=document.getElementById("nt-t").value.trim(),tx=document.getElementById("nt-x").value.trim();if(!ti||!tx){alert("Please add a title and some text.");break}const ts=Date.now();if(DB)DB.collection("notes").doc("n"+ts).set({t:P,title:ti,text:tx,ts}).catch(()=>alert("Could not save the note."));else{S.ln.push({id:"l"+ts,local:1,t:P,title:ti,text:tx,ts});save();render()}break}case"delnote":if(!confirm("Delete this note?"))break;if(d.l==="1"){S.ln=S.ln.filter(n=>n.id!==d.id);save();render()}else if(DB)DB.collection("notes").doc(d.id).delete().catch(()=>alert("Could not delete."));break;case"prev":if(G.i>0){G.i--;G.sel=G.picks[G.i]===undefined?null:G.picks[G.i];render()}break;case"back":go(V==="quiz"||V==="review"||V==="notes"?"topic":"dash",P);break;
case"pick":{if(G.sel!==null)break;const id=G.ids[G.i],q=Q[id],j=+d.j,c=j===q.a;G.sel=j;G.picks[G.i]=j;S.tot[q.t][1]++;if(c){S.tot[q.t][0]++;G.s++;G.xp+=10;S.xp+=10;S.mis=S.mis.filter(x=>x!==id)}else if(!S.mis.includes(id))S.mis.push(id);S.ans[id]=c?1:0;save();render();break}
case"next":if(G.i+1<G.ids.length){G.i++;G.sel=G.picks[G.i]===undefined?null:G.picks[G.i];render()}else{if(G.mode==="quiz")S.att++;const bonus=G.s/G.ids.length>=.8&&G.ids.length>1?20:0;S.xp+=bonus;G.xp+=bonus;S.hist.push({name:G.name,s:G.s,n:G.ids.length,xp:G.xp});S.hist=S.hist.slice(-20);save();go("results")}break;
case"retry":begin([+d.id],"Retry","retry");break;
case"retryall":begin(shuffle(S.mis.filter(i=>Q[i].t===P)),"Mistake review","retry");break;
case"reset":if(confirm("Reset all progress, XP and mistakes?")){S=fresh();save();render()}break}});
render();
(async()=>{try{const c=await claude.use("db");if(!c)return;DB=c;const u=await claude.use("user");ADM=!!(u&&u.canEdit());c.collection("notes").onSnapshot(s=>{DBN=s.docs.map(d=>({id:d.id,...d.data()}));if(V==="notes")render()},()=>{});if(V==="notes")render()}catch(e){}})();
</script></body></html>
